<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#77d9ff">
<title>ティラノンベースボール v0.2</title>
<style>
:root{--ink:#4a2d20;--mint:#aee7c8;--cream:#fff0b6;--orange:#ffad25;--red:#f05b46;--sky:#78d9ff;--deep:#2476bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;background:#caefff;color:var(--ink);overflow:hidden}button{font:inherit}
#game{position:relative;width:min(100vw,920px);height:100svh;margin:auto;overflow:hidden;background:var(--sky);touch-action:none;user-select:none}
.scene{position:absolute;inset:0;overflow:hidden;transition:opacity .18s ease}.hidden{opacity:0;pointer-events:none}
#batScene{background:linear-gradient(#79d8ff 0 45%,#dff7ff 45% 48%,#7fc861 48% 100%)}
.cloud{position:absolute;width:130px;height:33px;background:#fff;border-radius:999px;opacity:.86}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:58px;height:58px;left:22px;bottom:3px}.cloud:after{width:48px;height:48px;right:20px;bottom:4px}.c1{left:-10px;top:12%}.c2{right:-25px;top:20%;transform:scale(.75)}
#stands{position:absolute;left:0;right:0;top:36%;height:20%;background:linear-gradient(#e9f8ff 0 12%,#3d8ec8 12% 100%);border-top:5px solid #fff;border-bottom:5px solid #2a6f9e}.crowd{position:absolute;inset:18% 0 0;background-image:radial-gradient(circle,#fff 0 3px,transparent 4px),radial-gradient(circle,#ffd86e 0 3px,transparent 4px),radial-gradient(circle,#ff9d9d 0 3px,transparent 4px),radial-gradient(circle,#b9f0d1 0 3px,transparent 4px);background-size:28px 25px,34px 29px,39px 31px,44px 35px;background-position:0 0,10px 8px,18px 13px,25px 3px;opacity:.9}
#diamond{position:absolute;left:-8%;right:-8%;bottom:-13%;height:58%;background:radial-gradient(ellipse at 50% 82%,#cb915d 0 27%,transparent 27.5%),linear-gradient(#6fc24f,#8fd56c)}#diamond:before{content:"";position:absolute;width:70%;height:55%;left:15%;bottom:1%;background:#cb915d;clip-path:polygon(50% 0,100% 70%,50% 100%,0 70%)}
#ui{position:absolute;z-index:30;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#fff8e8e8;border:3px solid #fff;border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 #5c3d2530;font-weight:900;backdrop-filter:blur(4px)}#phase{font-size:13px}#score{font-size:22px}
#pitcher{position:absolute;z-index:8;left:13%;top:49%;width:82px;height:100px;transform-origin:50% 100%}.pbody{position:absolute;left:10px;top:25px;width:58px;height:62px;border:4px solid var(--ink);border-radius:45%;background:#86d4ec}.pcap{position:absolute;left:16px;top:10px;width:48px;height:22px;border:4px solid var(--ink);border-radius:50% 50% 20% 20%;background:#3471c7}.parm{position:absolute;width:18px;height:47px;right:-2px;top:37px;background:#86d4ec;border:4px solid var(--ink);border-radius:999px;transform-origin:8px 8px}.windup{animation:windup .72s cubic-bezier(.45,0,.3,1)}@keyframes windup{0%{transform:translateY(0)}25%{transform:translateY(-8px) rotate(-8deg)}52%{transform:translateY(-4px) rotate(-15deg)}76%{transform:translateX(9px) rotate(12deg)}100%{transform:none}}#pitcher.windup .parm{animation:throwArm .72s ease}@keyframes throwArm{0%,25%{transform:rotate(-35deg)}55%{transform:rotate(-115deg)}80%{transform:rotate(65deg)}100%{transform:rotate(10deg)}}
#batter{position:absolute;z-index:12;right:3%;bottom:13%;width:190px;height:220px;transform-origin:55% 90%;animation:idleBob 1.6s ease-in-out infinite}@keyframes idleBob{50%{transform:translateY(3px) rotate(.6deg)}}
#batter.prep{animation:prep .28s ease forwards}@keyframes prep{to{transform:translateX(3px) rotate(-4deg) scale(.99)}}#batter.swing{animation:swingBody .36s cubic-bezier(.2,.8,.2,1) forwards}@keyframes swingBody{0%{transform:rotate(-4deg)}35%{transform:rotate(7deg) translateX(-4px)}100%{transform:rotate(3deg) translateX(-8px)}}
.tira{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 0 #5d41282a)}
#bat{position:absolute;z-index:4;width:132px;height:17px;right:92px;top:61px;border:4px solid var(--ink);border-radius:999px;background:linear-gradient(90deg,#c87525,#efb45f 72%,#8e4a1c 73% 100%);transform-origin:100% 50%;transform:rotate(-24deg)}#batter.prep #bat{animation:batPrep .28s ease forwards}@keyframes batPrep{to{transform:rotate(-51deg)}}#batter.swing #bat{animation:batSwing .24s cubic-bezier(.18,.8,.32,1) forwards}@keyframes batSwing{0%{transform:rotate(-51deg)}65%{transform:rotate(50deg)}100%{transform:rotate(84deg)}}
#pitchBall,#heroBall{position:absolute;width:25px;height:25px;border-radius:50%;background:#fff;border:2px solid #d8d8d8;z-index:18;box-shadow:0 2px 6px #315b7d55;display:none}#pitchBall:before,#pitchBall:after,#heroBall:before,#heroBall:after{content:"";position:absolute;top:4px;width:8px;height:13px;border-left:2px dashed #e55a50;border-radius:50%}#pitchBall:before,#heroBall:before{left:4px;transform:rotate(18deg)}#pitchBall:after,#heroBall:after{right:3px;transform:rotate(198deg)}
#swingBtn{position:absolute;z-index:28;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(76%,360px);height:74px;border:4px solid #fff;border-radius:999px;background:linear-gradient(#ffdc53,#ff9d1b);color:#9e321c;font-size:28px;font-weight:1000;box-shadow:0 8px 0 #b95c18,0 14px 26px #6b401d44;transition:transform .05s,box-shadow .05s}#swingBtn:active{transform:translate(-50%,6px);box-shadow:0 2px 0 #b95c18}#swingBtn:disabled{opacity:.45;filter:grayscale(.35)}
#impact{position:absolute;z-index:35;width:30px;height:30px;display:none;pointer-events:none}.burst{position:absolute;inset:-50px;border-radius:50%;background:repeating-conic-gradient(from 0deg,#fff 0 6deg,transparent 6deg 16deg);animation:burst .28s ease-out forwards}@keyframes burst{from{transform:scale(.15) rotate(0);opacity:1}to{transform:scale(1.45) rotate(20deg);opacity:0}}.spark{position:absolute;left:50%;top:50%;width:12px;height:12px;background:#ffdf3b;transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 5px #fff6,0 0 25px 12px #ffd64b}
#hitText{position:absolute;z-index:36;left:50%;top:27%;transform:translateX(-50%) scale(.7);font-size:clamp(34px,9vw,72px);font-weight:1000;color:#f25c44;-webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #9e3627;opacity:0;pointer-events:none}.showHit{animation:hitPop .55s cubic-bezier(.2,1.4,.3,1) forwards}@keyframes hitPop{25%{opacity:1;transform:translateX(-50%) scale(1.12) rotate(-2deg)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.96)}}
#whiteFlash{position:absolute;z-index:60;inset:0;background:#fff;opacity:0;pointer-events:none}.flash{animation:flash .16s ease}@keyframes flash{0%{opacity:0}35%{opacity:.9}100%{opacity:0}}.shake{animation:screenShake .18s linear}@keyframes screenShake{25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,1px)}}

#flightScene{background:linear-gradient(#58c8ff 0 56%,#a8e7ff 56% 61%,#63b44d 61% 100%);perspective:700px}
#flightWorld{position:absolute;inset:-12%;transform-origin:50% 58%;overflow:hidden;background:linear-gradient(#5dccff 0 57%,#c7f0ff 57% 62%,#64b64f 62% 100%)}
.speedline{position:absolute;width:4px;height:110px;background:linear-gradient(transparent,#fff,transparent);opacity:.5;border-radius:999px;animation:speed 1s linear infinite}@keyframes speed{from{transform:translateY(-150px) scaleY(.6)}to{transform:translateY(120vh) scaleY(1.5)}}
#horizon{position:absolute;left:-10%;right:-10%;top:59%;height:12%;background:#2d8a46;clip-path:polygon(0 50%,4% 20%,9% 56%,14% 10%,19% 53%,24% 18%,30% 62%,36% 8%,43% 52%,49% 15%,56% 60%,63% 8%,70% 55%,78% 17%,86% 58%,93% 12%,100% 54%,100% 100%,0 100%)}
#road{position:absolute;left:50%;top:61%;width:110%;height:65%;transform:translateX(-50%) perspective(500px) rotateX(62deg);transform-origin:50% 0;background:repeating-linear-gradient(90deg,#77c45b 0 11%,#68b64e 11% 22%);border-top:8px solid #377c3c}.track{position:absolute;left:50%;top:0;width:22%;height:100%;transform:translateX(-50%);background:linear-gradient(90deg,transparent 0 46%,#ffffff55 46% 54%,transparent 54%)}
#heroBall{display:block;z-index:22;left:50%;top:52%;width:38px;height:38px;margin:-19px 0 0 -19px;box-shadow:0 0 0 6px #fff5,0 0 25px 12px #fff6;transition:filter .15s;will-change:transform}.trail{position:absolute;z-index:15;left:50%;top:52%;width:12px;height:190px;margin-left:-6px;margin-top:18px;background:linear-gradient(#fff9,transparent);filter:blur(2px);transform-origin:50% 0;border-radius:999px}
#flightHud{position:absolute;z-index:30;left:14px;right:14px;top:max(15px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.flightPill{background:#ffffffd9;border:3px solid #fff;border-radius:18px;padding:8px 12px;font-weight:1000;box-shadow:0 4px 0 #345b8230}.distance{font-size:28px}.sub{font-size:11px;opacity:.65}.dragHint{position:absolute;z-index:30;left:50%;bottom:max(35px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#183c5fb5;color:#fff;font-size:13px;font-weight:900;animation:hint 1s ease-in-out infinite alternate}@keyframes hint{to{transform:translateX(-50%) translateY(-5px)}}
.target{position:absolute;z-index:16;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#fff8;border:4px solid #fff;box-shadow:0 4px 12px #173b5a55;animation:targetFloat 1.1s ease-in-out infinite alternate}@keyframes targetFloat{to{transform:translateY(-8px)}}.target.ring{background:transparent;border:7px solid #ffe35b;box-shadow:0 0 0 4px #fff,0 0 25px #ffd839}.target.hit{animation:collect .35s ease forwards}@keyframes collect{to{transform:scale(1.8);opacity:0}}
#landingText{position:absolute;z-index:40;left:50%;top:32%;transform:translateX(-50%);width:90%;text-align:center;font-weight:1000;pointer-events:none}.landBig{font-size:clamp(34px,10vw,78px);color:#fff;-webkit-text-stroke:3px var(--deep);paint-order:stroke fill;text-shadow:0 5px 0 #1c5f9c}.landSmall{font-size:20px;color:#fff;text-shadow:0 2px 4px #194b6f}
#resultPanel{position:absolute;z-index:50;left:18px;right:18px;bottom:max(24px,env(safe-area-inset-bottom));padding:18px;border-radius:24px;background:#fff8e8f2;border:4px solid #fff;text-align:center;box-shadow:0 9px 0 #5d3b2235;display:none}.again{width:100%;border:0;border-radius:999px;background:linear-gradient(#ffdb50,#ff991b);box-shadow:0 6px 0 #b85a17;padding:14px;font-weight:1000;font-size:22px;color:#96301b}

#intro{position:absolute;z-index:70;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#74d7ffef,#e9faffef 48%,#83cc69ef)}.card{width:min(100%,520px);padding:24px;background:#fff8e9;border:5px solid #fff;border-radius:30px;text-align:center;box-shadow:0 10px 0 #63432625,0 20px 45px #35546c44}.logo{font-size:clamp(35px,9vw,58px);font-weight:1000;line-height:.95;color:#67cfa1;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 #f3b831}.logo span{display:block;color:#ffac24;font-size:.72em;margin-top:10px}.lead{font-weight:900;margin:18px 0 14px}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 18px}.flow div{background:#fff;border-radius:14px;padding:10px 5px;font-size:12px;font-weight:900}.flow b{display:block;font-size:24px}.start{width:100%;border:0;border-radius:999px;padding:16px;background:linear-gradient(#ffdb52,#ff9919);box-shadow:0 7px 0 #b75b17;color:#97311b;font-size:24px;font-weight:1000}.start:active{transform:translateY(5px);box-shadow:0 2px 0 #b75b17}
@media(max-width:520px){#batter{right:-4%;bottom:14%;width:168px;height:195px}#bat{width:118px;right:82px;top:55px}#pitcher{left:7%;top:50%;transform:scale(.88)}#ui{top:max(9px,env(safe-area-inset-top))}.pill{padding:7px 9px}#score{font-size:19px}.distance{font-size:24px}}
</style>
</head>
<body>
<main id="game">
  <section id="batScene" class="scene">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <div id="stands"><div class="crowd"></div></div><div id="diamond"></div>
    <div id="ui"><div class="pill"><div id="phase">1球アニメーション試作</div><div id="score">SCORE 0</div></div><div class="pill">狙え！<br>ジャストミート</div></div>
    <div id="pitcher"><div class="pcap"></div><div class="pbody"></div><div class="parm"></div></div>
    <div id="batter">
      <div id="bat"></div>
      <svg class="tira" viewBox="0 0 190 220" aria-label="ティラノン">
        <g stroke="#4a2d20" stroke-width="5" stroke-linejoin="round">
          <path fill="#ffb02a" d="M50 66 31 53 52 42 39 24 62 25 67 7 84 24 99 10 103 32 126 25 119 52z"/>
          <path fill="#aee7c8" d="M49 68C42 42 61 22 91 22c33 0 59 17 61 45 1 14-6 27-20 35 18 10 27 29 23 51-5 34-34 57-72 55-42-2-70-29-65-63 2-18 12-34 29-43-3-10-2-23 2-34z"/>
          <path fill="#fff0b6" d="M67 101c22-11 50-6 62 15 13 23 4 60-17 74-19 12-46 8-59-10-15-21-14-65 14-79z" stroke-width="3"/>
          <path fill="#aee7c8" d="M43 124C20 121 8 105 11 92c2-10 10-11 18-5 9 7 15 20 28 21"/>
          <path fill="#aee7c8" d="M137 126c21-4 34 5 36 17 2 11-5 18-15 15-11-4-18-14-28-12"/>
          <path fill="#aee7c8" d="M64 187c-17 9-31 23-24 31 6 8 31 3 49-8"/>
          <path fill="#aee7c8" d="M112 191c16 12 36 23 44 14 7-9-6-24-26-33"/>
        </g>
        <ellipse cx="86" cy="65" rx="7" ry="9" fill="#38251b"/><ellipse cx="128" cy="63" rx="6" ry="8" fill="#38251b"/>
        <circle cx="64" cy="79" r="9" fill="#ff999e" opacity=".72"/><circle cx="141" cy="76" r="8" fill="#ff999e" opacity=".72"/>
        <circle cx="104" cy="73" r="2" fill="#4a2d20"/><circle cx="114" cy="72" r="2" fill="#4a2d20"/>
        <path d="M95 81q15 14 31 0" fill="#ef706a" stroke="#4a2d20" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="pitchBall"></div>
    <div id="impact"><div class="burst"></div><div class="spark"></div></div>
    <div id="hitText">カキーーン！</div>
    <button id="swingBtn" type="button" disabled>⚾ スイング！</button>
  </section>

  <section id="flightScene" class="scene hidden">
    <div id="flightWorld"><div id="horizon"></div><div id="road"><div class="track"></div></div></div>
    <div class="speedline" style="left:12%;animation-delay:-.2s"></div><div class="speedline" style="left:28%;animation-delay:-.6s"></div><div class="speedline" style="left:72%;animation-delay:-.4s"></div><div class="speedline" style="left:87%;animation-delay:-.8s"></div>
    <div id="trail" class="trail"></div><div id="heroBall"></div>
    <div id="targets"></div>
    <div id="flightHud"><div class="flightPill"><div class="sub">飛距離</div><div id="distance" class="distance">0m</div></div><div class="flightPill"><div class="sub">GET</div><div id="loot">🍖 0　⭐ 0</div></div></div>
    <div class="dragHint">← 指でボールを動かす →</div>
    <div id="landingText"></div>
    <div id="resultPanel"><div id="resultCopy" style="font-size:20px;font-weight:1000;margin-bottom:12px"></div><button id="againBtn" class="again" type="button">もう1球！</button></div>
  </section>

  <div id="whiteFlash"></div>
  <section id="intro"><div class="card"><div class="logo">ティラノン<span>ベースボール</span></div><div class="lead">今回は「アニメーションの気持ちよさ」だけを優先した1球試作。</div><div class="flow"><div><b>①</b>投球を待つ</div><div><b>②</b>カキーン！</div><div><b>③</b>打球を操作</div></div><button id="startBtn" class="start" type="button">⚾ 1球やってみる</button></div></section>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s),game=$('#game'),batScene=$('#batScene'),flightScene=$('#flightScene'),pitcher=$('#pitcher'),batter=$('#batter'),pitchBall=$('#pitchBall'),swingBtn=$('#swingBtn'),impact=$('#impact'),hitText=$('#hitText'),whiteFlash=$('#whiteFlash'),intro=$('#intro'),startBtn=$('#startBtn'),heroBall=$('#heroBall'),targetsWrap=$('#targets'),distanceEl=$('#distance'),lootEl=$('#loot'),landingText=$('#landingText'),resultPanel=$('#resultPanel'),resultCopy=$('#resultCopy'),againBtn=$('#againBtn'),flightWorld=$('#flightWorld'),trail=$('#trail');
let state='idle',pitchStart=0,pitchDuration=1220,pitchRaf=0,p=0,audio=null,flightStart=0,flightRaf=0,ballX=0,ballY=0,dragging=false,lastX=0,lastY=0,meters=0,meat=0,stars=0,score=0,flightTime=5200;
function tone(f=440,d=.08,type='sine',v=.06){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function rect(el){const r=el.getBoundingClientRect(),g=game.getBoundingClientRect();return{x:r.left-g.left,y:r.top-g.top,w:r.width,h:r.height}}
function pitchPos(t){const a=rect(pitcher),b=rect(batter),sx=a.x+a.w*.72,sy=a.y+a.h*.55,ex=b.x+b.w*.38,ey=b.y+b.h*.43;const x=sx+(ex-sx)*t,y=sy+(ey-sy)*t-Math.sin(Math.PI*t)*12;pitchBall.style.transform=`translate(${x-12}px,${y-12}px) scale(${.78+t*.28}) rotate(${t*430}deg)`}
function resetBat(){state='ready';batScene.classList.remove('hidden');flightScene.classList.add('hidden');pitchBall.style.display='none';batter.className='';pitcher.className='';impact.style.display='none';hitText.className='';whiteFlash.className='';swingBtn.disabled=true;resultPanel.style.display='none';landingText.innerHTML='';score=0;setTimeout(beginPitch,620)}
function beginPitch(){if(state!=='ready')return;state='pitch';batter.classList.add('prep');pitcher.classList.add('windup');tone(240,.06,'triangle',.025);setTimeout(()=>{pitchBall.style.display='block';swingBtn.disabled=false;pitchStart=performance.now();pitchRaf=requestAnimationFrame(pitchLoop)},300)}
function pitchLoop(now){if(state!=='pitch')return;p=Math.min(1,(now-pitchStart)/pitchDuration);pitchPos(p);if(p>=1){miss('見逃し！');return}pitchRaf=requestAnimationFrame(pitchLoop)}
function swing(){if(state!=='pitch')return;state='swing';swingBtn.disabled=true;cancelAnimationFrame(pitchRaf);batter.classList.remove('prep');batter.classList.add('swing');const d=Math.abs(p-.89);if(d<.105){const quality=Math.max(0,1-d/.105);contact(quality)}else{miss(p<.89?'早すぎ！':'振り遅れ！')}}
function miss(txt){state='miss';swingBtn.disabled=true;pitchBall.style.display='none';batter.classList.remove('prep');batter.classList.add('swing');tone(145,.12,'sawtooth',.035);hitText.textContent=txt;hitText.className='showHit';setTimeout(()=>{hitText.className='';hitText.textContent='カキーーン！';state='ready';batter.className='';pitcher.className='';setTimeout(beginPitch,700)},900)}
function contact(q){state='hitstop';const pb=rect(pitchBall);pitchBall.style.display='none';impact.style.left=(pb.x-3)+'px';impact.style.top=(pb.y-3)+'px';impact.style.display='block';game.classList.add('shake');whiteFlash.className='flash';hitText.textContent=q>.72?'ジャストミート！':'カキーーン！';hitText.className='showHit';tone(540,.07,'square',.07);setTimeout(()=>tone(920,.16,'triangle',.06),45);setTimeout(()=>{game.classList.remove('shake');startFlight(q)},95)}
function makeTargets(){targetsWrap.innerHTML='';const data=[['🍖',22,42,'meat'],['⭐',73,35,'star'],['◎',50,22,'ring'],['🍖',79,58,'meat'],['⭐',30,64,'star'],['◎',58,47,'ring']];data.forEach((d,i)=>{const e=document.createElement('div');e.className='target '+(d[3]==='ring'?'ring':'');e.dataset.kind=d[3];e.style.left=d[1]+'%';e.style.top=d[2]+'%';e.textContent=d[0];e.style.animationDelay=(-i*.17)+'s';targetsWrap.appendChild(e)})}
function startFlight(q){state='flight';batScene.classList.add('hidden');flightScene.classList.remove('hidden');impact.style.display='none';meters=0;meat=0;stars=0;ballX=0;ballY=0;heroBall.style.transform='translate(0,0) scale(1)';flightWorld.style.transform='scale(1.22)';trail.style.transform='translateX(0) rotate(180deg)';distanceEl.textContent='0m';lootEl.textContent='🍖 0　⭐ 0';makeTargets();const power=.88+q*.28;flightTime=4600+q*1400;score=Math.round(900+q*900);flightStart=performance.now();tone(320,.35,'sawtooth',.018);flightRaf=requestAnimationFrame(flightLoop);setTimeout(()=>{flightWorld.style.transition='transform .75s cubic-bezier(.2,.8,.2,1)';flightWorld.style.transform='scale(1)';setTimeout(()=>flightWorld.style.transition='',800)},30)}
function flightLoop(now){if(state!=='flight')return;const t=Math.min(1,(now-flightStart)/flightTime);meters=Math.round(38+154*t);distanceEl.textContent=meters+'m';const bob=Math.sin(t*16)*3,scale=1+.08*Math.sin(t*9);heroBall.style.transform=`translate(${ballX}px,${ballY+bob}px) scale(${scale}) rotate(${t*900}deg)`;trail.style.transform=`translateX(${ballX}px) rotate(180deg)`;checkTargets();if(t>=1){land();return}flightRaf=requestAnimationFrame(flightLoop)}
function checkTargets(){const hb=heroBall.getBoundingClientRect();document.querySelectorAll('.target:not(.hit)').forEach(e=>{const r=e.getBoundingClientRect();const dx=(hb.left+hb.width/2)-(r.left+r.width/2),dy=(hb.top+hb.height/2)-(r.top+r.height/2);if(Math.hypot(dx,dy)<46){e.classList.add('hit');const k=e.dataset.kind;if(k==='meat'){meat++;tone(720,.08,'triangle',.045)}else if(k==='star'){stars++;tone(920,.1,'triangle',.045)}else{score+=500;tone(1100,.11,'square',.035)}lootEl.textContent=`🍖 ${meat}　⭐ ${stars}`}})}
function land(){state='land';cancelAnimationFrame(flightRaf);heroBall.style.transition='transform .35s cubic-bezier(.4,0,.8,.3)';heroBall.style.transform=`translate(${ballX}px,${ballY+240}px) scale(.7)`;game.classList.add('shake');tone(105,.18,'sawtooth',.05);setTimeout(()=>game.classList.remove('shake'),220);setTimeout(()=>{landingText.innerHTML=`<div class="landBig">${meters}m！</div><div class="landSmall">場外ホームラン！</div>`;resultCopy.textContent=`🍖${meat}　⭐${stars}　SCORE ${score+meat*250+stars*180}`;resultPanel.style.display='block';heroBall.style.transition='';state='result'},400)}
function moveBall(dx,dy){if(state!=='flight')return;ballX=Math.max(-game.clientWidth*.34,Math.min(game.clientWidth*.34,ballX+dx*.9));ballY=Math.max(-game.clientHeight*.18,Math.min(game.clientHeight*.15,ballY+dy*.55))}
game.addEventListener('pointerdown',e=>{if(state==='flight'){dragging=true;lastX=e.clientX;lastY=e.clientY;game.setPointerCapture?.(e.pointerId)}else if(state==='pitch'&&!e.target.closest('button'))swing()});game.addEventListener('pointermove',e=>{if(!dragging)return;moveBall(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY});game.addEventListener('pointerup',()=>dragging=false);game.addEventListener('pointercancel',()=>dragging=false);
swingBtn.addEventListener('click',e=>{e.stopPropagation();swing()});startBtn.addEventListener('click',()=>{intro.style.display='none';resetBat()});againBtn.addEventListener('click',()=>{flightScene.classList.add('hidden');heroBall.style.transform='';resetBat()});window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&state==='pitch'){e.preventDefault();swing()}if(state==='flight'){if(e.code==='ArrowLeft')moveBall(-18,0);if(e.code==='ArrowRight')moveBall(18,0);if(e.code==='ArrowUp')moveBall(0,-18);if(e.code==='ArrowDown')moveBall(0,18)}});
})();
</script>
</body>
</html>
