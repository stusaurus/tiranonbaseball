<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#69d6ff">
<title>ティラノンベースボール｜Cinematic One Ball</title>
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="fix-v5.css?v=5">
<style>#tiraWrap{aspect-ratio:2/3!important}</style>
</head>
<body>
<main id="game" aria-label="ティラノンベースボール アニメーション重視プロトタイプ">
  <section id="batScene" class="scene">
    <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
    <div id="stands"><div id="standsLogo">TIRANON BASEBALL</div></div><div id="diamond"></div><div id="plate"></div>
    <div id="pitcher"><div class="pitcherCap"></div><div class="pitcherBody"></div><div class="pitcherArm"></div></div>
    <div id="tiraWrap" class="breathe"><div id="tira"></div></div>
    <div id="trail"></div><div id="pitchBall"></div>
    <div id="topHud"><div class="hudPill"><small>ONE BALL CINEMA</small><strong id="batStatus">READY</strong></div><div id="phasePill" class="hudPill">① 打つ → ② 追う → ③ 操作</div></div>
    <div id="hint">投げたらタイミングよくタップ！</div><button id="swingBtn" type="button" disabled>⚾ スイング！</button>
    <div id="impactBurst"></div><div id="kakiin">カキーーン!!</div>
  </section>

  <section id="flightScene" class="scene" aria-label="打球追跡モード">
    <div id="skyGlow"></div><div id="farClouds" class="layer"></div><div id="mountainLayer" class="layer"></div><div id="cityLayer" class="layer"></div><div id="treeLayer" class="layer"></div><div id="groundLayer" class="layer"></div><div id="speedLines"></div>
    <div id="ballComet"></div><div id="flightBall"></div><div id="pickups"></div>
    <div id="flightHud"><div id="distanceBox"><small>飛距離</small><strong id="distanceNum">0m</strong></div><div id="flightScore"><small>SCORE</small><strong id="scoreNum">0</strong></div></div>
    <div id="steerHint">← 指を動かして打球を操作 →</div><div id="pickupText"></div><div id="landingDust"></div><div id="landText">ドーーン!!</div>
  </section>

  <div id="flash"></div>
  <section id="overlay">
    <div class="panel">
      <div id="intro"><div class="logo">ティラノン<span>ベースボール</span></div><div class="subtitle">今回は<strong>1球だけ</strong>。<br>打った瞬間からカメラがボールを追いかけるノン！</div><div class="cinemaTag">ANIMATION FIRST v0.5</div></div>
      <div id="result"><div class="logo" style="font-size:42px">ナイスバッティング！</div><div id="resultDistance" class="resultDistance">0m</div><div class="resultRow"><div class="resultStat"><b id="resultScore">0</b><small>スコア</small></div><div class="resultStat"><b id="resultMeat">0</b><small>🍖 お肉</small></div><div class="resultStat"><b id="resultStar">0</b><small>⭐ スター</small></div></div></div>
      <button id="startBtn" type="button" class="startBtn">⚾ 1球いってみる！</button>
    </div>
  </section>
</main>
<script>var steerHint=document.getElementById('steerHint');</script>
<script src="game.js?v=5"></script>
</body>
</html>
